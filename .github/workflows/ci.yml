name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/host-local-inventory-publisher]

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: Install native ACL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - run: bun install --frozen-lockfile
      - name: Build native-control addon
        run: npm run build --workspace @gjc-remote/native-control
      - run: npm test
      - name: Run exact-head Windows owned Publisher fixture
        if: runner.os == 'Windows'
        shell: powershell
        run: ./artifacts/g012-windows-owned-fixture.ps1
      - name: Upload Windows owned Publisher receipts
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: g012-windows-owned-receipts
          path: |
            artifacts/g012-windows-owned-receipt.json
            artifacts/g012-windows-owned-cleanup.json
            artifacts/g012-windows-owned-failure.log
          if-no-files-found: warn
      - name: Guard changelog history
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/changelog-history-guard.mjs --mode ${{ github.event_name == 'push' && 'push' || 'pr' }}

  test:
    if: always()
    needs: [suite]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to succeed
        run: |
          echo "suite result: ${{ needs.suite.result }}"
          test "${{ needs.suite.result }}" = "success"
